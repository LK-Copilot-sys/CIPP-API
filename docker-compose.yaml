services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: >
      azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
              --location /data --skipApiVersionCheck
    volumes:
      - azurite-data:/data

  cippapi:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      FUNCTIONS_WORKER_RUNTIME: powershell
      FUNCTIONS_WORKER_RUNTIME_VERSION: "7.4"
      FUNCTIONS_EXTENSION_VERSION: "~4"
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNoBnZf6KgBVU4VL/9I5/1V7y+zfH4qZmI2v4l0kUqYS+8w0VqEy39Wo+3OzuI3qkB8sqA==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      WEBSITE_HOSTNAME: cippapi
      NonLocalHostAzurite: "true"
      ApplicationID: ${ApplicationID}
      ApplicationSecret: ${ApplicationSecret}
      RefreshToken: ${RefreshToken}
      TenantID: ${TenantID}
    depends_on: [azurite]

  cippapi-nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [cippapi]
    expose: ["80"]
    # Coolify reads this label to expose via Traefik with HTTPS
    labels:
      - coolify.managed=true

volumes:
  azurite-data:
